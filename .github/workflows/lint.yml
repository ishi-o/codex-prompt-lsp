name: Lint

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/lint.yml"

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Lint
        run: npm run lint
        working-directory: server

      - name: Typecheck
        run: npm run typecheck
        working-directory: server

  style:
    name: Apply formatting
    # Style fixes are only applied on push (never on pull_request), and only
    # after lint has passed.
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Format
        run: npm run format
        working-directory: server

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply prettier formatting [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: server/**
