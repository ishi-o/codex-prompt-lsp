name: Build VS Code Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "server/**"
      - "vscode/**"
      - ".github/workflows/build-vscode-extension.yml"
  pull_request:
    paths:
      - "server/**"
      - "vscode/**"
      - ".github/workflows/build-vscode-extension.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            vscode/package-lock.json

      - name: Validate and build server
        run: npm ci && npm run typecheck && npm run lint && npm run build
        working-directory: server

      - name: Install extension
        run: npm ci
        working-directory: vscode

      - name: Typecheck extension
        run: npm run typecheck
        working-directory: vscode

      - name: Build extension
        run: npm run build
        working-directory: vscode

      - name: Package extension
        run: npm run package
        working-directory: vscode

      - uses: actions/upload-artifact@v4
        with:
          name: codex-prompt-lsp-vsix
          path: vscode/*.vsix

      - name: Verify release version
        if: >-
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          startsWith(github.ref, 'refs/tags/v')
        working-directory: vscode
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          fi

      - name: Publish extension
        if: >-
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          startsWith(github.ref, 'refs/tags/v')
        working-directory: vscode
        run: npx @vscode/vsce publish --no-dependencies --oidc
