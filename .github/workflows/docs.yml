name: Generate Vim Docs

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/docs.yml'
      - 'doc/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  docs:
    runs-on: ubuntu-latest
    name: Generate vimdoc from README
    steps:
      - uses: actions/checkout@v5

      - name: Create vimdoc output directory
        run: mkdir -p doc

      - name: Generate vimdoc
        uses: kdheepak/panvimdoc@main
        with:
          vimdoc: nvim-codex-lsp
          description: 'LSP completions for the Codex CLI chat input'
          version: 'v1.0.0'
          demojify: true
          treesitter: true

      - name: Generate helptags
        run: vim -Nu NONE -n -es -c "helptags doc/" -c "quit"

      - name: Create documentation pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            doc/*.txt
            doc/tags
          branch: docs/auto-generate-vimdoc
          delete-branch: true
          commit-message: 'docs: auto-generate vimdoc'
          title: 'docs: auto-generate vimdoc'
          body: 'Regenerate Vim help documentation from README.md.'
